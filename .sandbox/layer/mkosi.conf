# Platform's toolchain as agent-sandbox's project layer: tools only, what
# scripts/validate-pinned and the submodules' gates need. Built once as a
# directory over the sandbox base (mkosi --base-tree=<base>, at the base's
# snapshot), then cut into project.raw (sysext: /usr, /opt) and
# project-etc.raw (confext: /etc, which Arch's JDK and luarocks need).
[Distribution]
Distribution=arch

[Output]
Format=directory
Output=project
Overlay=yes

[Build]
WithNetwork=yes
ToolsTree=default

[Content]
Bootable=no
Packages=
        base-devel
        rust
        rust-wasm
        tree-sitter-cli
        python-jsonschema
        uv
        neovim
        lua51
        luarocks
        graphviz
        jre21-openjdk-headless
