# Tools only: what scripts/validate-pinned and the submodules' gates need.
# Project layer: see https://github.com/ca-mantis-shrimp/agent-sandbox#layers.
[Distribution]
Distribution=arch

[Output]
Format=directory
Output=project
Overlay=yes

[Build]
WithNetwork=yes
ToolsTree=default

[Content]
Bootable=no
Packages=
        base-devel
        rust
        rust-wasm
        tree-sitter-cli
        python-jsonschema
        uv
        neovim
        lua51
        luarocks
        graphviz
        jre21-openjdk-headless
