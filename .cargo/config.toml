# Local development override for the ClearHead tree-sitter grammar.
#
# clearhead-core, clearhead-lsp, and clearhead-cli depend on the grammar crate
# from its canonical Git repository (pinned to a revision) so any checkout of
# the Rust workspace builds standalone. When developing inside this platform
# workspace, this patch redirects that Git dependency to the adjacent
# submodule checkout, so local grammar edits propagate and
# `scripts/validate-pinned` verifies the exact pinned submodule composition
# rather than a fetched revision.
#
# The Rust crates themselves (core, the workspace-fs adapter, CLI, LSP) are
# members of one Cargo workspace in the clearhead-core repository and need no
# patching: they use ordinary sibling path dependencies.
#
# Cargo discovers this file by walking up from the working directory, so it is
# active for any cargo invocation inside the platform tree and inert for a
# standalone clone of the Rust workspace (which then builds from Git).
#
# `[patch]` paths in a .cargo/config.toml are resolved relative to the directory
# that contains .cargo (this platform root), so they name the submodule
# directories directly.
#
# Promote the rev pin to a version tag (e.g. tag = "v0.10.0") as a follow-up
# release step; the pin only matters to standalone consumers, since the
# platform layout patches it out.

[patch."https://github.com/ClearHeadToDo-Devs/tree-sitter-actions.git"]
tree-sitter-actions = { path = "tree-sitter-actions" }
